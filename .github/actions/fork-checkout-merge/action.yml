name: Fork checkout and upstream merge
description: >
  Checks out the pinned fork main commit and, when an upstream stable tag is given, merges it.
  A merge conflict fails the job so nothing downstream can build or publish. Uses plain git
  instead of actions/checkout: upstream's .repos reference gitlinks have no .gitmodules entries
  and break the checkout action's unconditional `git submodule foreach` auth cleanup.
inputs:
  main-sha:
    description: Fork main commit the release was planned against.
    required: true
  upstream-tag:
    description: Official stable tag to merge (vX.Y.Z). Empty skips the merge.
    required: false
    default: ""
  upstream-repo:
    description: Official upstream repository.
    required: false
    default: pingdotgg/t3code
  push-merged:
    description: Push the merge commit to fork main (release job only).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Checkout fork main
      shell: bash
      env:
        MAIN_SHA: ${{ inputs.main-sha }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        git init --initial-branch=main .
        git remote add origin "https://github.com/${REPO}.git"
        git fetch --no-tags --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*"
        git checkout --force "$MAIN_SHA"
        git log -1 --format=%H

    - name: Merge upstream stable
      if: inputs.upstream-tag != ''
      shell: bash
      env:
        UPSTREAM_TAG: ${{ inputs.upstream-tag }}
        UPSTREAM_REPO: ${{ inputs.upstream-repo }}
        PUSH_MERGED: ${{ inputs.push-merged }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Refusing non-stable upstream tag: $UPSTREAM_TAG"
          exit 1
        fi
        git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
        git fetch --no-tags upstream "+refs/tags/${UPSTREAM_TAG}:refs/tags/upstream/${UPSTREAM_TAG}"
        git config user.name "t3-fork-release-bot"
        git config user.email "actions@users.noreply.github.com"
        git merge --no-ff "upstream/${UPSTREAM_TAG}" \
          -m "chore: merge upstream ${UPSTREAM_TAG} into the enhanced fork"
        if [[ "$PUSH_MERGED" == "true" ]]; then
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/main
        fi
