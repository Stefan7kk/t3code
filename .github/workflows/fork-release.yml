# Enhanced fork release pipeline.
#
# Every 6 hours (and on demand) this workflow:
#   1. detects a newer official STABLE release of pingdotgg/t3code,
#   2. merges it into our patch series (conflicts abort everything),
#   3. runs the secret-scanning, lint, typecheck and full regression gates,
#   4. builds the Windows x64 NSIS installer with the fork update feed,
#   5. publishes a GitHub Release the native desktop updater can offer.
#
# Custom feature releases (release-current) ship our current main without waiting for upstream,
# using 0.1.(patch+1)-fork.N versions that sort below the next official stable.
#
# Security posture: least-privilege per-job permissions, actions pinned by SHA, frozen lockfile,
# no repository secrets beyond the scoped GITHUB_TOKEN, mandatory gitleaks gates, and release
# integrity verification (sha512 in latest.yml must match the installer) before publishing.
name: Fork Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: sync-upstream merges the newest official stable; release-current ships our main as a fork release.
        type: choice
        options:
          - sync-upstream
          - release-current
        default: sync-upstream

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: pingdotgg/t3code
  GITLEAKS_VERSION: "8.24.3"

jobs:
  detect:
    name: Detect release intent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.intent.outputs.should_release }}
      mode: ${{ steps.intent.outputs.mode }}
      version: ${{ steps.intent.outputs.version }}
      upstream_tag: ${{ steps.intent.outputs.upstream_tag }}
      main_sha: ${{ steps.intent.outputs.main_sha }}
    steps:
      - name: Checkout
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --initial-branch=main .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --no-tags --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force -B main refs/remotes/origin/main
          git log -1 --format=%H

      - name: Resolve release intent
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MODE: ${{ inputs.mode || 'sync-upstream' }}
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/tags/v*:refs/tags/upstream/v*"
          # Official stable tags only: plain vX.Y.Z, never nightly/preview/prerelease suffixes.
          upstream_latest="$(git tag -l 'upstream/v*' \
            | sed 's|^upstream/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1 || true)"
          # gh prefers the "upstream" remote added above; read this fork's releases explicitly.
          our_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | tr '\n' ',' | sed 's/,$//')"
          latest_plain="$(node -e "
            import('./scripts/fork/forkVersion.mjs').then((m) => {
              const tags = process.argv[1].split(',').filter(Boolean);
              const latest = m.latestPlainVersion(tags);
              console.log(latest ? m.formatVersion(latest) : '');
            });
          " "$our_tags")"
          mode="$INPUT_MODE"
          version=""
          upstream_tag=""
          should_release=false
          if [[ "$mode" == "sync-upstream" ]]; then
            if [[ -n "$upstream_latest" ]]; then
              newer="$(node -e "
                import('./scripts/fork/forkVersion.mjs').then((m) => {
                  const a = m.parseVersion(process.argv[1]);
                  const b = m.parseVersion(process.argv[2] || '0.0.0');
                  console.log(a && m.compareVersions(a, b) > 0 ? 'yes' : 'no');
                });
              " "$upstream_latest" "$latest_plain")"
              if [[ "$newer" == "yes" ]]; then
                version="${upstream_latest#v}"
                upstream_tag="$upstream_latest"
                should_release=true
              fi
            fi
          else
            if [[ -z "$latest_plain" ]]; then
              echo "::error::release-current needs at least one plain fork release recording the upstream base."
              exit 1
            fi
            version="$(node scripts/fork/forkVersion.mjs next --base "$latest_plain" --tags "$our_tags")"
            should_release=true
          fi
          if [[ "$should_release" == "true" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-fork\.[0-9]+)?$ ]]; then
            echo "::error::Computed version is not a valid fork release version."
            exit 1
          fi
          {
            echo "should_release=$should_release"
            echo "mode=$mode"
            echo "version=$version"
            echo "upstream_tag=$upstream_tag"
            echo "main_sha=$main_sha"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode version=$version upstream_tag=$upstream_tag should_release=$should_release"

  checks:
    name: Merge, secret scan, lint, typecheck
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout fork main
        shell: bash
        env:
          MAIN_SHA: ${{ needs.detect.outputs.main_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --initial-branch=main .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --no-tags --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "$MAIN_SHA"
          git log -1 --format=%H

      - name: Merge upstream stable
        if: needs.detect.outputs.upstream_tag != ''
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing non-stable upstream tag: $UPSTREAM_TAG"
            exit 1
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/tags/${UPSTREAM_TAG}:refs/tags/upstream/${UPSTREAM_TAG}"
          git config user.name "t3-fork-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff "upstream/${UPSTREAM_TAG}" \
            -m "chore: merge upstream ${UPSTREAM_TAG} into the enhanced fork"

      - name: Secret scan (full history and working tree)
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          # History scan covers every committed file, including the upstream merge. The audited
          # baseline ignores only the reviewed upstream-public fixture findings; anything new fails.
          ./gitleaks git . --log-opts="--all" --redact --no-banner --exit-code 1 \
            -b .gitleaks-baseline.json

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile

      - name: Fork versioning tests
        run: node --test scripts/fork/forkVersionNodeTest.mjs scripts/ci/browserInfraRetryCheck.mjs

      - name: Lint
        run: vp run lint

      - name: Typecheck
        run: vp run typecheck

  # Sharded like upstream release.yml (test, test_web, test_server): the server suite alone ran
  # ~29 minutes on one runner, and the web browser tests time out when they share its CPU.
  tests:
    name: Regression tests (${{ matrix.suite }})
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: packages
            args: run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test
          - suite: web 1/2
            args: run --filter @t3tools/web test --shard 1/2
          - suite: web 2/2
            args: run --filter @t3tools/web test --shard 2/2
          - suite: server 1/4
            args: run --filter t3 test --shard 1/4
          - suite: server 2/4
            args: run --filter t3 test --shard 2/4
          - suite: server 3/4
            args: run --filter t3 test --shard 3/4
          - suite: server 4/4
            args: run --filter t3 test --shard 4/4
    steps:
      - name: Checkout fork main
        shell: bash
        env:
          MAIN_SHA: ${{ needs.detect.outputs.main_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --initial-branch=main .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --no-tags --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "$MAIN_SHA"
          git log -1 --format=%H

      - name: Merge upstream stable
        if: needs.detect.outputs.upstream_tag != ''
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing non-stable upstream tag: $UPSTREAM_TAG"
            exit 1
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/tags/${UPSTREAM_TAG}:refs/tags/upstream/${UPSTREAM_TAG}"
          git config user.name "t3-fork-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff "upstream/${UPSTREAM_TAG}" \
            -m "chore: merge upstream ${UPSTREAM_TAG} into the enhanced fork"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile

      - name: Install browser test runtime
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          node apps/web/node_modules/playwright/cli.js install-deps chromium

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Regression tests
        env:
          T3CODE_TEST_RETRY: "2"
        run: node scripts/ci/run-regression-tests.mjs ${{ matrix.args }}

  # One job the publish step waits on. A failed or cancelled check or shard skips this job,
  # and a skipped gate blocks publishing.
  gate:
    name: Regression gate
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All checks and test shards passed
        run: echo "gate passed"

  cli-archive:
    name: Linux CLI archive (WSL runtime)
    # Builds only an artifact, so it runs beside the gate; publishing still needs both.
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout fork main
        shell: bash
        env:
          MAIN_SHA: ${{ needs.detect.outputs.main_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --initial-branch=main .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --no-tags --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "$MAIN_SHA"
          git log -1 --format=%H

      - name: Merge upstream stable
        if: needs.detect.outputs.upstream_tag != ''
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing non-stable upstream tag: $UPSTREAM_TAG"
            exit 1
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/tags/${UPSTREAM_TAG}:refs/tags/upstream/${UPSTREAM_TAG}"
          git config user.name "t3-fork-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff "upstream/${UPSTREAM_TAG}" \
            -m "chore: merge upstream ${UPSTREAM_TAG} into the enhanced fork"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile

      # Mirrors upstream release-desktop.yml: the archive packages a prebuilt server bundle,
      # web client, single executable and resource monitor.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.detect.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Build CLI single-executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/"

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform linux --arch x64 \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          compression-level: 0

  build-publish:
    name: Build Windows installer and publish
    # Builds beside the regression gate; the "Wait for regression gate" step blocks push and publish.
    needs: [detect, cli-archive]
    if: needs.detect.outputs.should_release == 'true'
    # Cross-builds like upstream release-desktop.yml; a Windows host packs extra native files.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout fork main
        shell: bash
        env:
          MAIN_SHA: ${{ needs.detect.outputs.main_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --initial-branch=main .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --no-tags --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "$MAIN_SHA"
          git log -1 --format=%H

      - name: Merge upstream stable
        if: needs.detect.outputs.upstream_tag != ''
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing non-stable upstream tag: $UPSTREAM_TAG"
            exit 1
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/tags/${UPSTREAM_TAG}:refs/tags/upstream/${UPSTREAM_TAG}"
          git config user.name "t3-fork-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff "upstream/${UPSTREAM_TAG}" \
            -m "chore: merge upstream ${UPSTREAM_TAG} into the enhanced fork"

      - name: Download CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: release-cli

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.detect.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build resource monitor
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Enable T3 Connect public configuration
        shell: bash
        run: cp .env.example .env

      - name: Build Windows NSIS installer
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: |
          set -euo pipefail
          wsl_runtime="$(ls release-cli/t3-*-linux-x64.tar.gz | head -n 1)"
          node scripts/build-desktop-artifact.ts \
            --platform win --target nsis --arch x64 \
            --build-version "$VERSION" \
            --skip-build --verbose \
            --wsl-runtime "$wsl_runtime" \
            --output-dir release

      - name: Verify release assets and integrity
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          exe="release/T3-Code-${VERSION}-x64.exe"
          test -f "$exe"
          test -f release/latest.yml
          ls release/*.blockmap
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const yaml = fs.readFileSync('release/latest.yml', 'utf8');
            const sha512 = /sha512: (\S+)/.exec(yaml)[1];
            const size = Number(/size: (\d+)/.exec(yaml)[1]);
            const bytes = fs.readFileSync(process.argv[1]);
            const actual = crypto.createHash('sha512').update(bytes).digest('base64');
            if (actual !== sha512 || bytes.length !== size) {
              console.error('latest.yml does not match the installer');
              process.exit(1);
            }
            console.log('release integrity OK');
          " "$exe"

      - name: Secret scan release artifacts
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks dir release --redact --no-banner --exit-code 1

      # Kept even when the gate fails, so an integrity-checked installer can be reviewed by hand.
      - name: Upload verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            release/T3-Code-*-x64.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Wait for regression gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job="Regression gate"
          for _ in $(seq 1 180); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"               --jq ".jobs[] | select(.name == \"$job\") | .status + \" \" + (.conclusion // \"\")")"
            echo "gate: ${state:-pending}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Regression gate did not pass; nothing is published."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for the regression gate."
          exit 1

      - name: Push merged main
        if: needs.detect.outputs.upstream_tag != ''
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/main

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          MODE: ${{ needs.detect.outputs.mode }}
        run: |
          set -euo pipefail
          {
            echo "Enhanced fork of pingdotgg/t3code — NOT an official signed T3 Tools release."
            echo
            if [[ "$MODE" == "sync-upstream" ]]; then
              echo "Upstream base: ${UPSTREAM_TAG} (official stable), merged with the fork patch series."
            else
              echo "Custom feature release on the current fork base."
            fi
            echo
            echo "Fork features: Claude Auto model/effort routing, Alibaba Token Plan quota monitoring,"
            echo "update session interlock, pre-install state backups. Unsigned build; the updater feed"
            echo "points at this repository."
            echo
            echo "Rollback: keep the previous installer; pre-update state backups live in userdata/backups."
          } > release-notes.md
          sha256sum release/T3-Code-"$VERSION"-x64.exe release/latest.yml release/*.blockmap > release/SHA256SUMS
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --title "T3 Code Enhanced ${VERSION} (fork)" \
            --notes-file release-notes.md \
            --latest \
            --target "$(git rev-parse HEAD)" \
            release/T3-Code-"$VERSION"-x64.exe \
            release/latest.yml \
            release/*.blockmap \
            release/SHA256SUMS

  notify-failure:
    name: Report pipeline failure
    needs: [detect, checks, tests, gate, cli-archive, build-publish]
    if: failure() && needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const version = process.env.VERSION || 'unknown';
            const mode = process.env.MODE || 'unknown';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fork release pipeline failed (${mode} ${version})`,
              body: [
                'The fork release pipeline stopped before publishing. No update was deployed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Common causes: upstream merge conflict, secret-scan finding, lint/typecheck/test',
                'failure, or build failure. Resolve and re-run the workflow manually.',
              ].join('\n'),
            });
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          MODE: ${{ needs.detect.outputs.mode }}
